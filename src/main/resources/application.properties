# Server Configuration
server.port=8080
spring.application.name=exam-management-system

# MongoDB Configuration (default localhost)
spring.data.mongodb.uri=mongodb://localhost:27017/exam_hub

# CORS Configuration (for React frontend)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Session Configuration
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=86400
spring.session.store-type=mongodb
spring.session.mongodb.collection-name=sessions

# Logging
logging.level.root=INFO
logging.level.com.university.exam=DEBUG

# Thread Pool Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
