# Server Configuration
server.port=8080
server.address=0.0.0.0
spring.application.name=exam-management-system

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/exam_hub?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS Configuration (for React frontend)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Session Configuration
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=86400
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=24h

# Logging
logging.level.root=INFO
logging.level.com.university.exam=DEBUG

# Thread Pool Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Proctoring Video Storage
app.proctoring.video-dir=./proctoring-videos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
